<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>抽歌终端 · MAIMAI DX</title>
<meta name="theme-color" content="#07080b" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<header class="hero">
  <div class="dial" id="dial" title="点我也能抽">
    <svg viewBox="-100 -100 200 200" aria-hidden="true"><g id="dialBars"></g></svg>
    <div class="dial-core">
      <span class="dial-num" id="poolNum">--</span>
      <span class="dial-cap">可抽谱面</span>
    </div>
  </div>
  <div class="hero-txt">
    <p class="kicker">MAIMAI DX · CHALLENGE GENERATOR</p>
    <h1>抽歌终端<span class="blink">_</span></h1>
    <p class="lede">按定数 / 难度 / 版本 / 谱师 / BPM 圈出练习池，随机抽谱。<span class="kbdon"><kbd>Space</kbd> 再抽一次。</span><span class="mobon">摇一摇手机，或点右下角按钮再抽。</span></p>
    <p class="src">曲库 <b id="dbTotal">--</b> 首 · 谱面 <b id="dbCharts">--</b> 张 · 据源 落雪 lxns ＋ 水鱼 diving-fish · <a href="plan.html">推分规划器 →</a></p>
  </div>
</header>

<main>
  <aside class="rail">
    <section class="box">
      <h2>抽取</h2>
      <div class="row">
        <label>数量<input id="n" type="number" min="1" max="30" value="3" /></label>
        <label>种子<input id="seed" type="text" placeholder="空=随机" /></label>
      </div>
      <button id="go" class="go">抽 歌</button>
      <label class="chk"><input id="noRepeat" type="checkbox" checked /> 排除历史抽过的谱面</label>
      <label class="chk"><input id="perSong" type="checkbox" checked /> 同一首歌只出一张谱</label>
    </section>

    <section class="box">
      <h2>难度</h2>
      <div class="chips" id="diffChips"></div>
    </section>

    <section class="box">
      <h2>谱面类型</h2>
      <div class="chips" id="typeChips"></div>
    </section>

    <section class="box">
      <h2>定数</h2>
      <div class="row">
        <label>下限<input id="dsMin" type="number" step="0.1" min="1" max="15" /></label>
        <label>上限<input id="dsMax" type="number" step="0.1" min="1" max="15" /></label>
      </div>
    </section>

    <section class="box">
      <h2>BPM / 文本</h2>
      <div class="row">
        <label>BPM ≥<input id="bpmMin" type="number" min="0" placeholder="不限" /></label>
        <label>BPM ≤<input id="bpmMax" type="number" min="0" placeholder="不限" /></label>
      </div>
      <label class="full">歌名<input id="qTitle" type="text" placeholder="模糊匹配" /></label>
      <label class="full">谱师<input id="qDesigner" type="text" placeholder="模糊匹配" /></label>
    </section>

    <section class="box">
      <h2>版本 <button class="mini" id="verAll">全选</button><button class="mini" id="verNone">清空</button></h2>
      <div class="chips vert" id="verChips"></div>
    </section>

    <section class="box">
      <h2>历史 <button class="mini danger" id="clearHist">清空</button></h2>
      <div id="hist" class="hist"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <span id="poolInfo">加载中…</span>
      <span class="spacer"></span>
      <span class="seedtag" id="seedTag"></span>
      <button class="mini" id="copyBtn" disabled>复制结果</button>
    </div>
    <div id="results" class="results"><p class="empty">点「抽歌」开始。数据在本地跑，不联网。</p></div>
  </section>
</main>

<footer>本地工具 · Python 标准库起服务 · 数据来自公开 API，仅供个人练习使用</footer>
<button class="gof" id="goFloat">抽歌</button>
<script src="core.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
